name: Build mod

on:
  push:
  workflow_dispatch:

permissions:
  contents: write   # needed only for tag releases

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache preloader download
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: deps-${{ hashFiles('CMakeLists.txt') }}

      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j

      - name: Package
        run: |
          mkdir -p dist/VVTierOverride
          cp build/libVVTierOverride.so manifest.json dist/VVTierOverride/
          $ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip \
            dist/VVTierOverride/libVVTierOverride.so
          (cd dist && zip -r VVTierOverride.zip VVTierOverride)

      - uses: actions/upload-artifact@v4
        with:
          name: VVTierOverride
          path: dist/VVTierOverride/

      - name: Release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/VVTierOverride.zip
